{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            padding: 16px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .product-card{
            padding: 8px;
            width: 30%;
            height: 64px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0, 0,0,0.2 );
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.8rem;
            color: rgb(64 63 63);
        }
        .product-card button{
            padding: 4px 3px;
            font-size: 10px;
            cursor: pointer;
            border-radius: 8px;
            background-color: #1c8fee;
            color: #fff;
            border: 1px solid #1580d8;
        }
        .container{
            padding: 8px;
            width: 1005;
            border: 1px solid;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <h1>Products</h1>
        <img src="{% static 'book-1.jpg' %}" alt="" width="50%">
    <div class="container">
        {% for p in products%}
        <div class="product-card">
            <h5>{{p.name}}</h5>
        
            <div>${{p.price}}</div>
            <button>view</button>
        </div>
        {%endfor%}
    </div>
</body>
</html>

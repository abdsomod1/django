<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <form action="{% url 'create_product_2' %}" method="post">
    {%csrf_token%} 
    <div>
    <label for="id_name">Name:</label>



<input type="text" name="name" maxlength="255" required="" id="id_name">
    
</div>

  <div>
    <label for="id_price">Price:</label>



<input type="number" name="price" value="0.00" step="0.01" required="" id="id_price">
    
</div>

  <div>
    <label for="id_category">Category:</label>



<select name="category" id="id_category">
  <option value="FASH">Fashion</option>

  <option value="TECH" selected="">Technology</option>

  <option value="BT">Beauty</option>

  <option value="OTHER">Other</option>

</select>
    
      
    
</div>
        <button>submit</button>
    </form>
</body>
</html>
